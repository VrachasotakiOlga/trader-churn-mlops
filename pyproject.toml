[project]
name = "trader-churn-mlops"
version = "0.1.0"
description = "Client churn prediction for a trading broker, built as an end-to-end MLOps project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.123",
    "fastapi>=0.162.0",
    "joblib>=1.6.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "prometheus-client>=0.26.0",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "moto[s3]>=5.2.5",
    "pytest>=8.0",
    "ruff>=0.6",
]
train = [
    "kubernetes>=37.0.1",
    "mlflow>=3.18.0",
]

[tool.uv]
default-groups = ["dev", "train"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/churn"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
