# Every setting you might change between environments lives here.

api:
  image:
    repository: trader-churn
    # Empty means "use appVersion from Chart.yaml".
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

training:
  image:
    repository: trader-churn-train
    tag: ""
    pullPolicy: IfNotPresent
  clients: 20000
  seed: 42
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

# Where models are stored. On real AWS, leave endpoint and credentialsSecret empty and
# give the pods' service account an IAM role instead (IRSA).
modelStore:
  bucket: trader-churn-models
  region: us-east-1
  # The address of an S3-compatible service, such as the MiniStack emulator.
  endpoint: ""
  # A Secret with AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY.
  credentialsSecret: ""
  # The only address pods may connect to. If empty, they may use DNS and any HTTPS.
  egressCidr: ""
  egressPort: 443

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  # Add pods when average CPU goes above this share of the requested CPU.
  targetCPUUtilizationPercentage: 70

networkPolicy:
  enabled: true

# Needs the Prometheus Operator installed first (see scripts/install_monitoring.sh).
monitoring:
  enabled: false
  # Prometheus lives here, and the NetworkPolicy lets it read /metrics.
  namespace: monitoring
  # PSI above this is a large shift from the training data.
  driftAlertThreshold: 0.25

# Retrain automatically when drift is detected.
retraining:
  enabled: true
  # Don't retrain again within this time, however many alerts arrive.
  cooldownSeconds: 900
  # A floor only. The real test is beating the production model on new data.
  minRocAuc: 0.6
  # This project has no real new data, so retraining generates clients with this much
  # drift. In production, this step would load recent clients with real outcomes.
  simulatedDrift: 1.0
  trigger:
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
