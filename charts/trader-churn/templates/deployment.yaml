# Keeps the API pods running, and replaces them gradually when something changes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trader-churn.fullname" . }}-api
  labels:
    {{- include "trader-churn.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  # With autoscaling on, the autoscaler decides. Setting replicas here too would make
  # each deploy reset the number of pods.
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Start one new pod before removing an old one, so capacity never drops.
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "trader-churn.apiSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "trader-churn.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ include "trader-churn.fullname" . }}
      securityContext:
        {{- include "trader-churn.podSecurityContext" . | nindent 8 }}
      # The API loads the model only once, at startup, so download it first. If its
      # checksum is wrong, this fails: the pod never starts, and the rollout stops
      # with the old pods still serving.
      initContainers:
        - name: fetch-model
          image: {{ include "trader-churn.apiImage" . | quote }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext:
            {{- include "trader-churn.containerSecurityContext" . | nindent 12 }}
          env:
            {{- include "trader-churn.modelStoreEnv" . | nindent 12 }}
          command:
            - python
            - -m
            - churn.storage
            - --bucket
            - {{ .Values.modelStore.bucket | quote }}
            - --output
            - /models
            - --wait-seconds
            - "300"
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: models
              mountPath: /models
      containers:
        - name: api
          image: {{ include "trader-churn.apiImage" . | quote }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext:
            {{- include "trader-churn.containerSecurityContext" . | nindent 12 }}
          env:
            - name: MODEL_PATH
              value: /models/model.joblib
          ports:
            - name: http
              containerPort: 8000
          # Removing a pod from the Service and stopping the pod happen at the same
          # time, so requests can still arrive for a moment. Keep serving while the
          # traffic moves away. Our load test failed 0.18% of requests without this.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          # Gives a slow start up to 60 seconds before the other two checks begin.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          # Failing means "restart this container".
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          # Failing means "stop sending this pod traffic".
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        # Each pod has its own copy, so pods can run on different nodes.
        - name: models
          emptyDir:
            sizeLimit: 200Mi
        - name: tmp
          emptyDir: {}
