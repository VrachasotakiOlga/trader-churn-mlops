# Trains the first model. A Job can't be edited, so the revision number in its name
# makes each "helm upgrade" start a new one, which stops if a model already exists.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "trader-churn.fullname" . }}-train-{{ .Release.Revision }}
  labels:
    {{- include "trader-churn.labels" . | nindent 4 }}
    app.kubernetes.io/component: training
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        {{- include "trader-churn.labels" . | nindent 8 }}
        app.kubernetes.io/component: training
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "trader-churn.fullname" . }}
      securityContext:
        {{- include "trader-churn.podSecurityContext" . | nindent 8 }}
      containers:
        - name: train
          image: {{ include "trader-churn.trainingImage" . | quote }}
          imagePullPolicy: {{ .Values.training.image.pullPolicy }}
          securityContext:
            {{- include "trader-churn.containerSecurityContext" . | nindent 12 }}
          env:
            {{- include "trader-churn.modelStoreEnv" . | nindent 12 }}
            - name: MODEL_BUCKET
              value: {{ .Values.modelStore.bucket | quote }}
            - name: CLIENTS
              value: {{ .Values.training.clients | int | quote }}
            - name: SEED
              value: {{ .Values.training.seed | int | quote }}
          # If the quality gate fails, this exits with an error, the Job fails, and
          # nothing is uploaded.
          command:
            - sh
            - -ec
            - |
              python -m churn.data --clients "$CLIENTS" --seed "$SEED" --output /tmp/clients.csv
              python -m churn.train --seed "$SEED" --data /tmp/clients.csv --output /tmp/models/model.joblib --tracking-uri sqlite:////tmp/mlflow.db --s3-bucket "$MODEL_BUCKET" --skip-if-production-exists
          resources:
            {{- toYaml .Values.training.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
