# The pods get their own identity with no permissions, and no token to talk to the
# Kubernetes API. If a pod were compromised, it couldn't use the cluster's API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "trader-churn.fullname" . }}
  labels:
    {{- include "trader-churn.labels" . | nindent 4 }}
automountServiceAccountToken: false
