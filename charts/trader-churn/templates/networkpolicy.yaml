{{- if .Values.networkPolicy.enabled }}
# Only pods labelled trader-churn-api-access=true may call the API. Its only outgoing
# connection is to the model bucket. Health checks from the node still work.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "trader-churn.fullname" . }}-api
  labels:
    {{- include "trader-churn.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "trader-churn.apiSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              trader-churn-api-access: "true"
      ports:
        - port: http
    {{- if .Values.monitoring.enabled }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.monitoring.namespace }}
      ports:
        - port: http
    {{- end }}
  egress:
    {{- include "trader-churn.modelStoreEgress" . | nindent 4 }}
---
# Training's only connection is to the model bucket.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "trader-churn.fullname" . }}-training
  labels:
    {{- include "trader-churn.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: training
  policyTypes:
    - Ingress
    - Egress
  egress:
    {{- include "trader-churn.modelStoreEgress" . | nindent 4 }}
{{- end }}
